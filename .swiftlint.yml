# .swiftlint.yml

# ----------------------------
# Базовые настройки
# ----------------------------
reporter: "xcode"   # чтобы сообщения красиво показывались в Xcode

# Какие папки не линтить
excluded:
  - Pods
  - Carthage
  - DerivedData
  - .build
  - fastlane
  - "*/Generated/*"
  - "*/R.generated.swift"
  - "*/SwiftGen/*"

# ----------------------------
# Opt-in правила (включаются явно)
# ----------------------------
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - redundant_type_annotation
  - sorted_first_last
  - closure_spacing

# ----------------------------
# Настройка длины строк
# ----------------------------
line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

# ----------------------------
# Имена
# ----------------------------
identifier_name:
  min_length: 2
  excluded:
    - id
    - URL
    - x
    - y

type_name:
  min_length: 3
  max_length: 50

# ----------------------------
# Сложность/размер (мягкие лимиты)
# ----------------------------
function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  warning: 12
  error: 18
